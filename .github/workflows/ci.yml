name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 9.2：允許從 Actions 分頁 / API 手動觸發 CI，便於在無新 commit 時重跑驗證
  # （自動排程多輪皆需確認 main 上三個 job 全綠，手動觸發可避免靠空 commit 觸發）。
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不指定 version；pnpm 版本以 package.json 的 "packageManager": "pnpm@9.12.0" 為唯一來源，
      # 避免與 action 輸入重複導致 ERR_PNPM_BAD_PM_VERSION。
      - uses: pnpm/action-setup@v4

      # 不開啟 pnpm 快取：repo 未提交 pnpm-lock.yaml（install 以 --frozen-lockfile=false 執行），
      # setup-node 的 cache: pnpm 需以 lockfile 為快取 key，缺檔會直接報錯。
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

  # 7.1：首批正式持久化資料（Holiday 表）後，驗證 migration 能在乾淨 DB 套用且 seed 可建立範例假日。
  # 獨立於 build-test，避免 DB 服務影響純編譯 / 單元測試流程。
  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wfms
          POSTGRES_PASSWORD: wfms
          POSTGRES_DB: wfms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wfms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wfms:wfms@localhost:5432/wfms?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # postinstall 已執行 prisma generate；此處對乾淨 DB 套用所有 migration。
      - name: Apply migrations (prisma migrate deploy)
        run: pnpm --filter @wfms/api exec prisma migrate deploy

      - name: Seed example data
        run: pnpm --filter @wfms/api run db:seed

  # 9.1：服務層整合測試（真實 Postgres）。
  # 與 migration-check 相同的 service 模式：乾淨 DB → migrate deploy → 跑 *.int-spec.ts。
  # 獨立 job，避免 DB 相依測試拖慢/污染純單元測試流程。
  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wfms
          POSTGRES_PASSWORD: wfms
          POSTGRES_DB: wfms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wfms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wfms:wfms@localhost:5432/wfms_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Apply migrations (prisma migrate deploy)
        run: pnpm --filter @wfms/api exec prisma migrate deploy

      - name: Integration tests (real DB)
        run: pnpm --filter @wfms/api run test:integration
