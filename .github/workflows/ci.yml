name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不指定 version；pnpm 版本以 package.json 的 "packageManager": "pnpm@9.12.0" 為唯一來源，
      # 避免與 action 輸入重複導致 ERR_PNPM_BAD_PM_VERSION。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test
