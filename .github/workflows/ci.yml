name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不指定 version；pnpm 版本以 package.json 的 "packageManager": "pnpm@9.12.0" 為唯一來源，
      # 避免與 action 輸入重複導致 ERR_PNPM_BAD_PM_VERSION。
      - uses: pnpm/action-setup@v4

      # 不開啟 pnpm 快取：repo 未提交 pnpm-lock.yaml（install 以 --frozen-lockfile=false 執行），
      # setup-node 的 cache: pnpm 需以 lockfile 為快取 key，缺檔會直接報錯。
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test
